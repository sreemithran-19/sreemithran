<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ChangeFlow Enterprise</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6fb;--card:#fff;--tx:#0f1b33;--mu:#64748b;--bd:#e2e8f0;--ac:#2563eb;--nv:#0b1a33;--nv2:#13294d;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#111f38;--tx:#e6edf8;--mu:#93a4bf;--bd:#223454;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1424;--card:#111f38;--tx:#e6edf8;--mu:#93a4bf;--bd:#223454;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit}a{color:inherit;text-decoration:none}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600}.btn.o{background:transparent;border:1px solid #5b7aa8;color:inherit}.btn.s{padding:4px 9px;font-size:12px}.btn.g{background:#16a34a}.btn.r{background:#dc2626}.btn.y{background:#d97706}
/* landing */
.land{background:linear-gradient(160deg,#07122a,#0f2547 60%,#12356b);color:#e6edf8;min-height:100vh}
.nav{display:flex;justify-content:space-between;align-items:center;padding:18px 6vw;flex-wrap:wrap;gap:10px}
.logo{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}.logo i{background:var(--ac);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-style:normal}
.hero{padding:7vh 6vw 4vh;max-width:980px}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.1;margin:0 0 16px}.hero p{color:#a9bbd6;font-size:17px;max-width:640px}
.pv{margin:20px 6vw;background:#0c1d3a;border:1px solid #223d68;border-radius:14px;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.pv div{background:#13294d;border-radius:10px;padding:12px}.pv b{font-size:24px;display:block}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;padding:30px 6vw 60px}
.feat div{background:#0f2244;border:1px solid #223d68;border-radius:12px;padding:20px}.feat h3{margin:6px 0}.feat p{color:#a9bbd6;margin:0}
/* login */
.lg{max-width:380px;margin:12vh auto;background:var(--card);color:var(--tx);padding:28px;border-radius:14px}.lg label{display:block;margin:12px 0 4px;color:var(--mu);font-size:12px}.lg input,.lg select,.mod input,.mod select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
/* app */
.app{display:flex;min-height:100vh}.sb{width:236px;background:var(--nv);color:#c5d3ea;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.sb a{display:flex;gap:10px;padding:9px 12px;border-radius:8px;margin:2px 0;cursor:pointer}.sb a:hover{background:var(--nv2)}.sb a.on{background:var(--ac);color:#fff}
.main{flex:1;min-width:0}.top{display:flex;gap:12px;align-items:center;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top input{flex:1;max-width:340px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}.top .sp{flex:1}
.pg{padding:24px}.pg h2{margin:0 0 4px}.sub{color:var(--mu);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}.kpi b{font-size:28px;display:block}.kpi span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;text-transform:uppercase}
.bd{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#dbeafe;color:#1d4ed8}.bd.ok{background:#dcfce7;color:#15803d}.bd.w{background:#fef3c7;color:#b45309}.bd.x{background:#fee2e2;color:#b91c1c}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row span:first-child{width:90px;font-size:12px;color:var(--mu)}.row .bar{flex:1}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.kb>div{background:var(--bg);border-radius:10px;padding:10px}.kb .card{margin:8px 0;padding:10px}
.tb{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.tb input{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);min-width:220px}
.ov{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:20;padding:16px}.mod{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}.mod label{display:block;margin:10px 0 3px;font-size:12px;color:var(--mu)}
.donut{width:130px;height:130px;border-radius:50%;margin:auto}
@media(max-width:800px){.sb{display:none}.pg{padding:14px}}
</style></head><body><div id="root"></div>
<script>
const $=s=>document.querySelector(s),R=$('#root');
let role=null,q='';
const D={
orders:[['PO-1001','Winter Jackets Batch A','Northwind Apparel','Jackets',5000,'High','In Production',62,'2026-12-20','R. Menon'],['PO-1002','School Uniform Set','Greenfield Schools','Uniforms',8000,'Medium','Planning',15,'2027-01-15','R. Menon'],['PO-1003','Denim Trousers','Urban Threads','Denim',3200,'High','Quality Inspection',91,'2026-12-05','A. Das'],['PO-1004','Sports Tees','FitLine','T-Shirts',12000,'Low','Order Received',3,'2027-02-10','A. Das'],['PO-1005','Hospital Scrubs','CareWell','Scrubs',2500,'High','On Hold',40,'2026-11-20','R. Menon'],['PO-1006','Linen Shirts','Coastal Co.','Shirts',1800,'Medium','Completed',100,'2026-11-10','A. Das']],
units:[['U-01','Fabric','S. Iyer',24,78,3,'Active'],['U-02','Cutting','P. Nair',18,64,4,'Active'],['U-03','Stitching','K. Raj',60,92,5,'Active'],['U-04','Finishing','M. Devi',22,55,3,'Active'],['U-05','Packing','L. Joseph',15,40,2,'Active'],['U-06','Quality','T. Hassan',10,70,3,'Active']],
employees:[['E-101','Anita Rao','Stitching','Machine operation, Overlock','K. Raj',5,'Active'],['E-102','Vikram Singh','Cutting','Pattern cutting, Stitching','P. Nair',3,'Active'],['E-103','Meera Pillai','Finishing','Pressing, Packing','M. Devi',2,'Active'],['E-104','Arun Kumar','Quality','Inspection, Finishing','T. Hassan',4,'Active'],['E-105','Divya Sen','Fabric','Fabric prep, Cutting','S. Iyer',1,'Active'],['E-106','Rahul Das','Packing','Packing, Pressing','L. Joseph',0,'On Leave']],
tasks:[['T-501','PO-1001','Stitching','Anita Rao','Stitch sleeves – 800 pcs','2026-11-30','High','In Progress'],['T-502','PO-1001','Cutting','Vikram Singh','Cut panels – 1200 pcs','2026-11-24','High','Delayed'],['T-503','PO-1003','Quality','Arun Kumar','Final inspection lot 3','2026-11-29','Medium','Accepted'],['T-504','PO-1002','Fabric','Divya Sen','Prepare 600 m fabric','2026-12-03','Medium','Assigned'],['T-505','PO-1006','Packing','Rahul Das','Pack 1800 shirts','2026-11-10','Low','Completed']],
approvals:[['AR-301','Material change','K. Raj','PO-1001','Verified','Low','Ready for Approval','Pending'],['AR-302','Machine change','P. Nair','PO-1002','Needs Attention','Medium','Needs Manager Review','Pending'],['AR-303','CAPEX','M. Devi','PO-1003','Human Review Required','High','Risk Review Required','Pending'],['AR-304','Task reassignment','T. Hassan','PO-1003','Verified','Low','Ready for Approval','Approved'],['AR-305','Method change','S. Iyer','PO-1004','Missing Information','Medium','Additional Evidence Required','Rejected']],
changes:[['CH-201','Switch to recycled lining','Material','Stitching','PO-1001','Cost and sustainability','Pending'],['CH-202','New cutting table','Machine','Cutting','PO-1002','Throughput increase','Approved'],['CH-203','Revised stitch sequence','Method','Stitching','PO-1001','Reduce rework','In Implementation'],['CH-204','Night-shift operator swap','Man','Finishing','PO-1003','Skill coverage','Approved'],['CH-205','Alternate thread vendor','Material','Fabric','PO-1005','Supply delay','Rejected']],
documents:[['DOC-01','PO-1001 spec sheet.pdf','Production Order','PO-1001','PDF','Extracted'],['DOC-02','Lining test report.jpg','Approval Request','AR-301','JPG','Extracted'],['DOC-03','Machine quote.pdf','Approval Request','AR-303','PDF','Pending OCR'],['DOC-04','Daily report 24-Nov.png','Daily Report','PO-1001','PNG','Manual entry']],
quality:[['QI-01','PO-1003','Quality','2026-11-25','A. Kumar','Passed','0'],['QI-02','PO-1001','Stitching','2026-11-26','A. Kumar','Rework Required','14'],['QI-03','PO-1005','Finishing','2026-11-22','T. Hassan','Failed','31'],['QI-04','PO-1002','Cutting','2026-11-27','A. Kumar','Pending Inspection','–']],
maintenance:[['M-01','Overlock OL-7','Stitching','Breakdown','R. Babu','Under Maintenance','2026-11-28'],['M-02','Cutter CT-2','Cutting','Preventive','R. Babu','Operational','2026-12-02'],['M-03','Press PR-4','Finishing','Request','S. Mohan','Maintenance Required','2026-11-30'],['M-04','Folder FD-1','Packing','Breakdown','S. Mohan','Temporarily Unavailable','2026-12-04']],
payments:[['E-101','Anita Rao','Stitching','Nov 2026','₹32,000','Processing','–'],['E-102','Vikram Singh','Cutting','Nov 2026','₹30,500','Pending','–'],['E-103','Meera Pillai','Finishing','Oct 2026','₹28,000','Paid','2026-11-01'],['E-104','Arun Kumar','Quality','Oct 2026','₹35,000','Paid','2026-11-01'],['E-106','Rahul Das','Packing','Oct 2026','₹24,500','On Hold','–']],
notifs:[['New approval request AR-303 awaits risk review','Approval','5 min ago'],['Task T-502 is overdue','Task','1 hr ago'],['PO-1005 production delayed – On Hold','Delay','3 hr ago'],['Quality inspection QI-02 needs rework','Quality','Yesterday']],
audit:[['2026-11-27 09:12','r.menon','Approved','AR-304','Pending → Approved'],['2026-11-27 08:40','k.raj','Created','AR-301','– → Pending'],['2026-11-26 16:05','hr.accounts','Updated','PAY-E101','Pending → Processing'],['2026-11-26 11:30','a.das','Uploaded','DOC-02','Quality evidence']],
rules:[['Material change','Low risk','Auto-approve allowed','Production Manager'],['CAPEX','Any','Human approval only','Company Manager'],['Machine change','Medium+','Quality + Maintenance review','Maintenance Manager'],['Method change','Any','Quality sign-off','Quality Manager']]};
const M={
orders:{t:'Production Orders',s:'Track every received order from planning to delivery.',c:['Order ID','Order','Customer','Product','Qty','Priority','Status','Progress','Due','Manager'],k:'orders',st:6,pr:7},
units:{t:'Unit Management',s:'Capacity, workload and status for each production unit.',c:['Unit ID','Unit','Manager','Employees','Workload %','Active Orders','Status'],k:'units',pr:4},
employees:{t:'Employee Management',s:'Profiles, skills, supervisors and workload.',c:['ID','Name','Unit','Skills','Supervisor','Open Tasks','Status'],k:'employees',st:6},
tasks:{t:'Task Allocation',s:'Assign, reassign and track tasks. Suggestions are reviewed by managers.',c:['Task','Order','Unit','Employee','Description','Deadline','Priority','Status'],k:'tasks',st:7,act:'task'},
approvals:{t:'Approval Center',s:'Evidence-based approvals with verification and risk routing.',c:['Request','Type','Requester','Order','Verification','Risk','Recommendation','Status'],k:'approvals',st:7,act:'appr'},
changes:{t:'4M Change Management',s:'Man · Machine · Material · Method changes linked to orders and approvals.',c:['ID','Title','4M','Unit','Order','Reason','Status'],k:'changes',st:6},
documents:{t:'Document Intelligence',s:'Uploads, OCR extraction and validation (PDF, JPG, PNG).',c:['ID','File','Attached To','Record','Type','OCR'],k:'documents',st:5},
quality:{t:'Quality Management',s:'Inspections, defects and rework tied to orders.',c:['ID','Order','Unit','Date','Inspector','Status','Defects'],k:'quality',st:5},
maintenance:{t:'Maintenance',s:'Machines, breakdowns and preventive schedules.',c:['ID','Machine','Unit','Type','Technician','Status','Expected'],k:'maintenance',st:5},
payments:{t:'Employee Payment Status',s:'Status tracking only – no payroll or bank transfers.',c:['Emp ID','Name','Unit','Period','Amount','Status','Paid On'],k:'payments',st:5,lock:1},
notifications:{t:'Notifications',s:'Alerts for approvals, tasks, delays and quality.',c:['Message','Type','When'],k:'notifs'},
audit:{t:'Audit Trail',s:'Immutable log of every important action.',c:['Time','User','Action','Entity','Change'],k:'audit',lock:2},
config:{t:'Settings',s:'Approval rules and company policies.',c:['Request Type','Risk','Policy','Reviewer'],k:'rules',lock:2}};
const NAV=[['dashboard','Dashboard','▦'],['orders','Production Orders','▤'],['planning','Production Planning','◫'],['units','Unit Management','▣'],['employees','Employee Management','☺'],['tasks','Task Allocation','✓'],['approvals','Approval Center','✔'],['changes','Change Management','⇄'],['documents','Document Intelligence','▥'],['quality','Quality Management','◎'],['maintenance','Maintenance','⚙'],['payments','Employee Payment Status','₹'],['reports','Reports & Analytics','◔'],['notifications','Notifications','🔔'],['audit','Audit Trail','☰'],['config','Settings','⚒']];
const ROLES={'Administrator':'all','Company Manager':'all','Production Manager':'all','Unit Supervisor':['dashboard','orders','planning','units','employees','tasks','approvals','changes','documents','quality','notifications'],'HR / Accounts Manager':['dashboard','employees','payments','reports','notifications'],'Employee':['dashboard','tasks','documents','notifications'],'Quality Manager':['dashboard','orders','approvals','changes','documents','quality','reports','notifications'],'Maintenance Manager':['dashboard','units','approvals','changes','maintenance','reports','notifications']};
const can=k=>{const r=ROLES[role];if(r!=='all'&&!r.includes(k))return 0;const l=M[k]&&M[k].lock;if(l===1)return['Administrator','Company Manager','HR / Accounts Manager'].includes(role);if(l===2)return['Administrator','Company Manager'].includes(role);if(k==='audit'&&role==='Production Manager')return 1;return 1},
badge=v=>{v=String(v);const c=/Completed|Passed|Approved|Paid|Operational|Verified|Active|Ready|Extracted/.test(v)?'ok':/Delayed|Failed|Rejected|Hold|Breakdown|Unavailable|Inconsistent/.test(v)?'x':/Pending|Attention|Rework|Missing|Required|Human|Processing|Review|Under|Planning|Leave/.test(v)?'w':'';return`<span class="bd ${c}">${v}</span>`},
bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`,
log=(a,e,c)=>{D.audit.unshift([new Date().toISOString().slice(0,16).replace('T',' '),role.split(' ')[0].toLowerCase(),a,e,c]);D.notifs.unshift([a+' '+e+': '+c,'Update','just now'])};
function land(){R.innerHTML=`<div class="land"><div class="nav"><div class="logo"><i>◆</i>ChangeFlow Enterprise</div><div><a href="#login" class="btn">Enter Platform</a></div></div>
<div class="hero"><h1>Transform Manufacturing Operations into an Intelligent Digital Workflow</h1><p>ChangeFlow Enterprise centralizes production execution, approvals, operational tasks, document verification and management visibility into one connected platform.</p><p><a href="#login" class="btn">Enter Platform</a> &nbsp; <a class="btn o" href="#features" onclick="event.preventDefault();document.getElementById('f').scrollIntoView({behavior:'smooth'})">Explore Features</a></p></div>
<div class="pv"><div><b>${D.orders.filter(o=>!/Completed/.test(o[6])).length}</b>Active orders</div><div><b>${D.approvals.filter(a=>a[7]=='Pending').length}</b>Pending approvals</div><div><b>${D.units.length}</b>Units live</div><div><b>${D.tasks.length}</b>Open tasks</div><div><b>${Math.round(D.orders.reduce((s,o)=>s+o[7],0)/D.orders.length)}%</b>Avg completion</div></div>
<div class="feat" id="f">${[['Operational automation','Task allocation with skill and workload suggestions that managers always control.'],['Production management','Orders, stages, units and daily reports in one timeline-driven workspace.'],['Intelligent verification','OCR evidence checks, risk routing and human escalation for high-risk requests.'],['4M change control','Man, Machine, Material and Method changes tied to orders and approvals.'],['Quality & maintenance','Inspections, defects, breakdowns and machine availability tracking.'],['Audit & analytics','Every action logged; dashboards computed from live records.']].map(f=>`<div><h3>${f[0]}</h3><p>${f[1]}</p></div>`).join('')}</div></div>`}
function login(){R.innerHTML=`<div class="land"><div class="lg"><div class="logo" style="color:var(--tx)"><i style="color:#fff">◆</i>ChangeFlow</div><label>Demo role</label><select id="rs">${Object.keys(ROLES).map(r=>`<option>${r}</option>`).join('')}</select><label>Email</label><input value="demo@changeflow.com"><label>Password</label><input type="password" value="demo1234"><p><button class="btn" style="width:100%" onclick="role=$('#rs').value;log('Signed in','session',role);location.hash='dashboard'">Sign in</button></p><a href="#home" style="color:var(--mu);font-size:12px">← Back to website</a></div></div>`}
function shell(k,body){R.innerHTML=`<div class="app"><aside class="sb"><div class="logo" style="padding:6px 10px 14px;color:#fff"><i>◆</i>ChangeFlow</div>${NAV.filter(n=>can(n[0])).map(n=>`<a class="${n[0]==k?'on':''}" href="#${n[0]}"><span>${n[2]}</span>${n[1]}</a>`).join('')}</aside><div class="main"><div class="top"><input id="gs" placeholder="Search records…" value="${q}" oninput="q=this.value;go(true)"><span class="sp"></span><a href="#notifications">🔔 ${D.notifs.length}</a><span class="bd">${role}</span><button class="btn s o" style="color:var(--tx);border-color:var(--bd)" onclick="role=null;location.hash='home'">Logout</button></div><div class="pg">${body}</div></div></div>`;if(q){const i=$('#gs');i.focus();i.setSelectionRange(q.length,q.length)}}
function dash(){const O=D.orders,pend=D.approvals.filter(a=>a[7]=='Pending').length,od=D.tasks.filter(t=>t[7]=='Delayed').length,st={};O.forEach(o=>st[o[6]]=(st[o[6]]||0)+1);const cols=['#2563eb','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2','#64748b','#db2777'];let a=0,tot=O.length,g=Object.keys(st).map((s,i)=>{const p=st[s]/tot*100,r=`${cols[i]} ${a}% ${a+p}%`;a+=p;return r});
const kp=[['Active orders',O.filter(o=>!/Completed/.test(o[6])).length],['Completed',O.filter(o=>o[6]=='Completed').length],['In production',O.filter(o=>o[6]=='In Production').length],['Delayed / On hold',O.filter(o=>o[6]=='On Hold').length],['Pending approvals',pend],['Overdue tasks',od],['Units active',D.units.length],['Completion rate',Math.round(O.reduce((s,o)=>s+o[7],0)/tot)+'%']];
return`<h2>Management Dashboard</h2><p class="sub">Live figures computed from current records.</p><div class="grid">${kp.map(k=>`<div class="card kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div>
<div class="grid g2"><div class="card"><h3>Production progress</h3>${O.map(o=>`<div class="row"><span>${o[0]}</span>${bar(o[7])}<span style="width:36px">${o[7]}%</span></div>`).join('')}</div>
<div class="card"><h3>Order status</h3><div class="donut" style="background:conic-gradient(${g.join(',')})"></div><p>${Object.keys(st).map((s,i)=>`<span style="color:${cols[i]}">●</span> ${s} (${st[s]}) &nbsp;`).join('')}</p></div>
<div class="card"><h3>Unit-wise workload</h3>${D.units.map(u=>`<div class="row"><span>${u[1]}</span>${bar(u[4])}<span style="width:36px">${u[4]}%</span></div>`).join('')}</div>
<div class="card"><h3>Alerts & bottlenecks</h3>${D.units.filter(u=>u[4]>85).map(u=>`<p>⚠ ${u[1]} unit at ${u[4]}% capacity</p>`).join('')}${D.tasks.filter(t=>t[7]=='Delayed').map(t=>`<p>⏰ ${t[0]} overdue – ${t[4]}</p>`).join('')}<p>✔ ${pend} approvals awaiting decision</p></div>
<div class="card"><h3>Payment status</h3>${['Paid','Processing','Pending','On Hold'].map(s=>`<p>${badge(s)} ${D.payments.filter(p=>p[5]==s).length}</p>`).join('')}</div>
<div class="card"><h3>Recent activity</h3>${D.audit.slice(0,5).map(a=>`<p><b>${a[1]}</b> ${a[2].toLowerCase()} ${a[3]} <span style="color:var(--mu)">${a[0]}</span></p>`).join('')}</div></div>`}
function table(k){const m=M[k];if(k=='approvals'||k=='tasks'||k=='orders'||k=='employees'||k=='changes'||k=='quality'||k=='maintenance'||k=='payments'||k=='documents'||k=='units'){}
const rows=D[m.k].filter(r=>!q||r.join(' ').toLowerCase().includes(q.toLowerCase()));
const act=(r,i)=>{if(m.act=='appr'&&r[7]=='Pending')return`<td><button class="btn s g" onclick="dec('approvals',${i},'Approved')">Approve</button> <button class="btn s r" onclick="dec('approvals',${i},'Rejected')">Reject</button> <button class="btn s y" onclick="dec('approvals',${i},'Revision Requested')">Revise</button></td>`;if(m.act=='task'&&r[7]!='Completed')return`<td><button class="btn s" onclick="adv(${i})">Advance</button></td>`;return m.act?'<td></td>':''};
return`<h2>${m.t}</h2><p class="sub">${m.s}</p><div class="tb"><button class="btn" onclick="add('${k}')">+ New</button><span style="color:var(--mu);align-self:center">${rows.length} records${k=='payments'?' · restricted to authorized roles':''}</span></div><div class="card tw"><table><tr>${m.c.map(c=>`<th>${c}</th>`).join('')}${m.act?'<th>Actions</th>':''}</tr>${rows.map(r=>{const i=D[m.k].indexOf(r);return`<tr>${r.map((v,j)=>`<td>${j==m.st?badge(v):j==m.pr?bar(v)+' '+v+'%':v}</td>`).join('')}${act(r,i)}</tr>`}).join('')}</table></div>`}
const dec=(k,i,s)=>{const r=D[k][i],o=r[7];r[7]=s;log(s,r[0],o+' → '+s);go()},
adv=i=>{const r=D.tasks[i],f=['Assigned','Accepted','In Progress','Completed'],n=f[Math.min(f.indexOf(r[7])+1,3)]||'Accepted';log('Task updated',r[0],r[7]+' → '+n);r[7]=n;go()};
function add(k){const m=M[k];const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="mod"><h3>New – ${m.t}</h3>${m.c.map((c,i)=>`<label>${c}</label><input data-i="${i}">`).join('')}<p><button class="btn" id="sv">Save</button> <button class="btn o" style="color:var(--tx)" id="cx">Cancel</button></p></div>`;document.body.appendChild(o);$('#cx').onclick=()=>o.remove();$('#sv').onclick=()=>{const r=[...o.querySelectorAll('input')].map(x=>x.value||'–');D[m.k].unshift(r);log('Created',r[0],m.t);o.remove();go()}}
function plan(){const S=['Cutting','Stitching','Finishing','Quality','Packing'],T=['Planned','In Progress','Completed'];const st=[];D.orders.slice(0,4).forEach((o,i)=>S.forEach((s,j)=>{if(j<=i+1)st.push([o[0],s,j<i?'Completed':j==i?'In Progress':'Planned'])}));
return`<h2>Production Planning</h2><p class="sub">Stage board for active orders (Kanban view).</p><div class="kb">${T.map(t=>`<div><b>${t}</b>${st.filter(s=>s[2]==t).map(s=>`<div class="card"><b>${s[0]}</b><br>${s[1]}</div>`).join('')}</div>`).join('')}</div>`}
function rep(){const g=(a,f)=>{const m={};a.forEach(r=>m[f(r)]=(m[f(r)]||0)+1);return Object.entries(m)},bars=(a,t)=>`<div class="card"><h3>${t}</h3>${a.map(x=>`<div class="row"><span style="width:130px">${x[0]}</span>${bar(x[1]/Math.max(...a.map(y=>y[1]))*100)}<span style="width:20px">${x[1]}</span></div>`).join('')}</div>`;
return`<h2>Reports & Analytics</h2><p class="sub">Aggregated from live records.</p><div class="grid g2">${bars(g(D.approvals,r=>r[1]),'Approval categories')}${bars(g(D.tasks,r=>r[7]),'Task status')}${bars(g(D.quality,r=>r[5]),'Quality results')}${bars(g(D.maintenance,r=>r[5]),'Machine availability')}${bars(g(D.changes,r=>r[2]),'4M changes')}${bars(g(D.payments,r=>r[5]),'Payment status')}</div>`}
function go(keep){const k=(location.hash||'#home').slice(1);if(k=='home'||k=='')return land();if(k=='login')return login();if(!role){location.hash='login';return}if(!can(k)&&k!='dashboard'){return shell(k,'<h2>Access denied</h2><p class="sub">Your role is not authorized for this module.</p>')}
shell(k,k=='dashboard'?dash():k=='planning'?plan():k=='reports'?rep():M[k]?table(k):dash())}
addEventListener('hashchange',()=>{q='';go()});go();
</script></body></html>
